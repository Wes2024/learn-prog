    <!-- permite definitir contexto sobre imagenes que se usaran o opciones de imagenes -->
    <picture>
        <source type="image/webp" src="../img/RE4.webp">
        <source media="(max-width: 400px)" srcset="../img/RE4-small.webp">
        <source media="(max-width: 600px)" srcset="../img/RE4-medium.png">
        <img src="../img/RE4.jpg" alt="imagen">
    </picture>
